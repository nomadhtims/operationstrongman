<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f12" />
  <meta name="description" content="Importable strongman programming and training tracker." />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
  <link rel="stylesheet" href="./style.css" />
  <title>Operation Strongman</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand" data-nav="home" aria-label="Home">
        <span class="brand-mark">OS</span>
        <span>
          <strong>Operation Strongman</strong>
          <small id="brandSubtitle">Programme-driven training</small>
        </span>
      </button>
      <button id="installBtn" class="ghost-btn hidden">Install</button>
    </header>

    <main id="main" tabindex="-1"><div class="card"><p class="muted">Loading programme…</p></div></main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button data-nav="home" class="nav-btn active"><span>⌂</span><small>Home</small></button>
      <button data-nav="program" class="nav-btn"><span>▦</span><small>Plan</small></button>
      <button data-nav="history" class="nav-btn"><span>↻</span><small>History</small></button>
      <button data-nav="settings" class="nav-btn"><span>⚙</span><small>Data</small></button>
    </nav>
  </div>
  <script src="./app-core.js"></script>
  <script src="./app-render.js"></script>
  <script src="./app-events.js"></script>
</body>
</html>
